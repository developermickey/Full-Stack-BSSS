<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 1 For Tabel</title>
</head>

<body>
    <!-- Create a table for Order List heaidng should be Order No. Item Name, Price -->
    <table border>
        <thead>
            <tr>
                <th>Order No</th>
                <th>Item Name</th>
                <th>Price</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>TShirt</td>
                <td>999</td>
            </tr>
            <tr>
                <td>2</td>
                <td>TShirt</td>
                <td>1499</td>
            </tr>
            <tr>
                <td>3</td>
                <td>TShirt</td>
                <td>2499</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="2">Total</td>
                <td>4997</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
