<!DOCTYPE html>
<html lang="en"> <!-- Root Element-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube | Video Uploading Website</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
</head>
<body>

    <header class="header">
        <div class="header-left">
            <button class="menu-btn" type="button">
               <i class="ri-menu-line"></i>
            </button>

            <a href="#" class="logo">
                <img src="./img/logo.svg" alt="YouTube Logo" width="100">
            </a>
        </div>

        <div class="header-center">
                <form class="search-box">
                    <input type="search" placeholder="Search">
                    <button type="submit" class="search-btn">
                        <i class="ri-search-line"></i>
                    </button>

                </form>

                <button class="mic-btn" type="button">
                    <i class="ri-mic-line"></i>
                </button>


        </div>
        <div class="header-right">

            <div class="create">   
                <i class="ri-add-line"></i>
                <span>Create</span>
            </div>
            <div class="notification">
                <i class="ri-notification-line"></i>
                <span class="counter">9+</span>
            </div>

            <div class="profile">
                <img src="https://yt3.ggpht.com/aPufUwMY7QEYzfUnxrstbskVn67a6g6pf3CFrsU6-o8qVAvMpqR_MlN90tK8h-tqqwA5OkEFng=s88-c-k-c0x00ffffff-no-rj" alt="Profile Image" width="30" height="30">
            </div>

        </div>
    </header>

    
    
</body>
</html>
